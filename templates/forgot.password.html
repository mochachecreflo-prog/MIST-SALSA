<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MIST Salsa KU</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-top: 4px solid #e63946; }
        h2 { text-align: center; color: #e63946; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #333; background: #2a2a2a; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .alert { background: #d62839; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label>New Password</label>
            <input type="password" name="password" required placeholder="Enter new password">
            <button type="submit">Update Password</button>
        </form>
    </div>
</body>
</html>
